<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Pro — My Plan</title>
<style>
  :root{
    --green:#1a8f5a;--green-dark:#15784a;--green-accent:#3da972;--green-soft:#e5f2ea;
    --cream:#f4ede4;--cream-deep:#ebe1d2;--white:#fff;
    --ink:#1f1f1f;--ink-soft:#3d3d3d;--grey:#7d7d7d;--grey-light:#b8b3a9;--rule:#e2dccf;
    --cp:#fdf3d4;--cpt:#8a6d1a;--cc:#fde6cf;--cct:#9b561e;--cf:#fdd9d9;--cft:#9c3e3e;--co:#d6f0e0;--cot:#2a7a4d;--ct:#e6e1f5;--ctt:#5b4d8a;
    --shadow-sm:0 6px 18px -10px rgba(31,31,31,.14);--shadow:0 12px 32px -14px rgba(31,31,31,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{border-bottom:1px solid var(--rule);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;background:rgba(244,237,228,.94);position:sticky;top:0;z-index:40}
  .logo{font-size:20px;font-weight:700}.logo span{color:var(--green-accent)}
  nav.appnav{display:flex;align-items:center;gap:4px}
  nav.appnav a{font-size:13.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:8px}
  nav.appnav a:hover{background:var(--green-soft);color:var(--green-dark)}
  nav.appnav a.on{color:var(--green-dark);background:var(--green-soft)}
  nav.appnav button{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--grey);cursor:pointer;padding:7px 12px;border-radius:8px}
  nav.appnav button:hover{color:#9c3e3e}
  main{max-width:960px;margin:0 auto;padding:28px 24px 110px}
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--green);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
  .note{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 15px;font-size:13.5px;margin:14px 0 4px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;padding:11px 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-dark)}
  .btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--rule)}.btn-ghost:hover{border-color:var(--green-accent)}
  .empty{background:var(--white);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow-sm);padding:44px 28px;text-align:center;margin-top:10px}
  .empty h2{font-size:20px;font-weight:700;margin-bottom:8px}.empty p{font-size:14.5px;color:var(--ink-soft);margin-bottom:18px}
  .btn:disabled{opacity:.6;cursor:default}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
  .pill{background:var(--white);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm)}
  .pill .n{font-size:20px;font-weight:700;color:var(--green-dark);line-height:1}.pill .l{font-size:11.5px;color:var(--grey);margin-top:4px}
  .day{margin-bottom:30px}
  .day-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .day-name{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .tag{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
  .tag.training{background:var(--green-soft);color:var(--green-dark)}.tag.rest{background:var(--ct);color:var(--ctt)}
  .tag.out{background:#fdf0e6;color:var(--cct)}.tag.weekend{background:#e6f0f5;color:#2c6b8a}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .meal{background:var(--white);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .2s}
  .meal:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .mimg{height:120px;position:relative;background-size:cover;background-position:center}
  .slot{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--ink-soft);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .mbody{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column}
  .mname{font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:9px;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .c{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .c.p{background:var(--cp);color:var(--cpt)}.c.c{background:var(--cc);color:var(--cct)}.c.f{background:var(--cf);color:var(--cft)}.c.o{background:var(--co);color:var(--cot)}.c.t{background:var(--ct);color:var(--ctt)}
  .kcal{font-size:12.5px;color:var(--grey);font-weight:500}
  .mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .macts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mact{background:none;border:1px solid var(--rule);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .mact:hover{background:var(--green-soft);border-color:var(--green-accent);color:var(--green-dark)}
  .mact.fav{font-size:14px;line-height:1;padding:5px 9px}
  .mact.fav.on{color:#c0392b;border-color:#e8b4b4;background:#fdecec}
  .mact.eaten.on{background:var(--green);border-color:var(--green);color:#fff}
  .meal.eaten{opacity:.62}
  .modal .recipe{font-size:14px;line-height:1.6;color:var(--ink-soft);max-height:56vh;overflow:auto;margin:4px 0 8px}
  .modal .recipe p{margin:0 0 10px}
  .kids{margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);font-size:12px;color:var(--ink-soft)}
  .kids b{color:var(--green-dark)}
  .outcard{display:flex;flex-direction:column;justify-content:center;background:#fdf0e6;border:1px dashed #f0c9a8;border-radius:14px;padding:18px;color:var(--cct);font-size:13px;line-height:1.5}
  .outcard .sl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;opacity:.85}
  .snacks{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;background:var(--white);border:1px solid var(--rule);border-radius:12px;font-size:12.5px;color:var(--ink-soft)}
  .snacks .ic{width:26px;height:26px;border-radius:8px;background:var(--co);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .snacks b{color:var(--ink)}
  /* shopping list */
  .shopwrap{margin-top:12px;background:var(--white);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow-sm);padding:22px 24px}
  .shophead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .shophead h2{font-size:20px;font-weight:700}
  .shopsub{font-size:13px;color:var(--grey);margin-bottom:18px}
  .shopcat{margin-bottom:18px}
  .shopcat h3{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green-dark);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .item{display:flex;align-items:flex-start;gap:11px;padding:7px 0;font-size:14px}
  .item input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
  .item .nm{flex:1;color:var(--green-dark);text-decoration:none}
  .item .nm:hover{text-decoration:underline}
  .item .nm .qn{display:block;font-size:11.5px;color:var(--grey);text-decoration:none}
  .item.done .nm{text-decoration:line-through;color:var(--grey-light)}
  .item .pr{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;font-weight:600}
  .shoptot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:16px;border-top:2px solid var(--rule);font-size:15px;font-weight:700}
  .shoptot .big{font-size:22px;color:var(--green-dark)}
  /* swap modal */
  .overlay{position:fixed;inset:0;background:rgba(31,31,31,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--white);border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:24px}
  .modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
  .modal .msub{font-size:13px;color:var(--grey);margin-bottom:16px}
  .alt{border:1px solid var(--rule);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .alt:hover{border-color:var(--green-accent);background:var(--green-soft)}
  .alt .an{font-size:14.5px;font-weight:600;margin-bottom:3px}
  .alt .ad{font-size:12.5px;color:var(--ink-soft)}
  .alt .ak{font-size:12px;color:var(--green-dark);font-weight:600;margin-top:5px}
  .modal .close{background:none;border:none;font-family:inherit;font-size:14px;color:var(--grey);cursor:pointer;margin-top:6px;text-decoration:underline}
  .modal .loading{font-size:14px;color:var(--ink-soft);padding:20px 0;text-align:center}
  @media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.grid{grid-template-columns:1fr}nav.appnav a,nav.appnav button{padding:7px 8px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div><span class="logo">Meal Plan <span>Pro</span></span></div>
  <nav class="appnav">
    <a href="thisweek.html">This Week</a>
    <a href="myplan.html" class="on">My Plan</a>
    <a href="settings.html">Settings</a>
    <button id="signout" type="button">Sign out</button>
  </nav>
</header>
<main>
  <div class="topbar">
    <div>
      <div class="eyebrow" id="range">Your week</div>
      <h1>This week's plan.</h1>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="approveBtn" type="button" style="display:none">Approve &amp; view shopping list ↓</button>
      <button class="btn btn-ghost" id="raceBtn" type="button" style="display:none">🏁 Race-week plan</button>
      <a class="btn btn-ghost" href="thisweek.html">Plan another week →</a>
    </div>
  </div>
  <div id="banner" class="note" style="display:none"></div>
  <div class="stats" id="stats"></div>
  <div id="days"></div>
  <div id="shopping"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const BACKEND='https://meal-plan-backend-su6p.onrender.com';
let authToken=(typeof localStorage!=='undefined'&&localStorage.getItem('authToken'))||null;
function api(path,method,body){const o={method:method||'GET',headers:{'Content-Type':'application/json'}};if(authToken)o.headers.Authorization='Bearer '+authToken;if(body)o.body=JSON.stringify(body);return fetch(BACKEND+path,o).then(r=>r.json());}

let currentPlan=null;    // the plan being viewed
let currentPlanId=null;  // the saved plan id (needed for a full swap)
let shoppingShown=false; // whether the shopping list is currently revealed
const eatenSet=new Set();// meals ticked as eaten this session (keyed "di:mi")
// household context, loaded from the profile
const ctx={ profileId:null, retailer:'Tesco', familySize:2, favourites:new Set(), athlete:null };

// Build a product-search link for an item at the household's chosen supermarket.
function retailerSearchUrl(ret, item){
  const q=encodeURIComponent(item||'');
  switch(String(ret||'').toLowerCase().replace(/[^a-z]/g,'')){
    case 'tesco':      return 'https://www.tesco.com/groceries/en-GB/search?query='+q;
    case 'sainsburys': return 'https://www.sainsburys.co.uk/gol-ui/SearchResults/'+q;
    case 'asda':       return 'https://groceries.asda.com/search/'+q;
    case 'waitrose':   return 'https://www.waitrose.com/ecom/shop/search?&searchTerm='+q;
    case 'ocado':      return 'https://www.ocado.com/search?entry='+q;
    case 'morrisons':  return 'https://groceries.morrisons.com/search?entry='+q;
    default:           return 'https://www.google.com/search?q='+q+'+'+encodeURIComponent(ret||'supermarket');
  }
}
// Load the household profile: retailer, family size, and saved favourites.
async function loadContext(){
  try{ const s=sessionStorage.getItem('mpp_retailer'); if(s) ctx.retailer=s; }catch(e){}
  if(!authToken) return;
  try{
    const list=await api('/api/clients'); const id=list&&list.profiles&&list.profiles[0]&&list.profiles[0].id;
    if(!id) return; ctx.profileId=id;
    const d=await api('/api/clients/'+id); const p=(d&&d.profile)||{}; const c=p.client_data||{};
    if(p.retailer||c.retailer) ctx.retailer=p.retailer||c.retailer;
    const kids=((p.children||c.children||[])||[]).length||0;
    ctx.familySize=Math.max(1,Math.min(10, 1+(c.hasAdult2?1:0)+kids));
    ctx.favourites=new Set(Array.isArray(c.favouriteMeals)?c.favouriteMeals:[]);
    // Who (if anyone) trains for a sport — enables the race-week fuelling plan.
    if(c.hasSports && c.sport) ctx.athlete={name:c.fname,sport:c.sport,weight:c.weight,diet:c.diet,giSensitivity:c.giSensitivity,eventName:c.eventName};
    else if(c.adult2hasSports && c.adult2sport) ctx.athlete={name:c.adult2name||'Partner',sport:c.adult2sport,weight:c.adult2weight,diet:c.adult2diet,giSensitivity:c.giSensitivity,eventName:c.adult2eventName||c.eventName};
    else ctx.athlete=null;
    const rb=document.getElementById('raceBtn'); if(rb) rb.style.display=ctx.athlete?'':'none';
    if(currentPlan) repaint();   // reflect favourites/retailer now they're known
  }catch(e){}
}
// Re-render the current plan, preserving a revealed shopping list.
function repaint(){
  if(!currentPlan)return;
  render(currentPlan);
  if(shoppingShown){ renderShopping(currentPlan); const b=document.getElementById('approveBtn'); if(b){b.textContent='Approved ✓ — shopping list below';b.disabled=true;} }
}

// ── themed "photo" tile (stand-in for the matched stock library) ──
function tile(theme){
  const T={oats:['#efe0c0','#e2cc9e','#f6efe0',[['#c99a63',36,58,17],['#b5532f',56,52,7],['#7c4bb0',63,60,6]]],
    salmon:['#f3d3c2','#e7a988','#f7efe6',[['#e0805f',40,58,17],['#3f7d46',60,56,10],['#f0e7d4',56,66,11]]],
    chicken:['#e4ecc9','#cfe0a8','#f5f2e6',[['#e7d5a6',40,58,16],['#4e8a3f',58,54,11],['#c94b3a',62,64,6]]],
    fish:['#d7e4e2','#aecdc9','#f2efe6',[['#e7ddc6',42,58,16],['#5a9e9a',60,55,9],['#c9a24b',56,64,7]]],
    eggs:['#f5e7c6','#eed7a4','#faf4e6',[['#f6efe0',42,58,17],['#f0b429',43,57,7],['#c96a3a',60,60,9]]],
    wrap:['#eed9b6','#ddbe8a','#f6efe0',[['#e0c893',42,56,16],['#4e8a3f',56,52,9],['#c94b3a',60,63,6]]],
    beef:['#e6cbb0','#d3a578','#f5ece0',[['#8a4a33',40,58,16],['#e9dcbf',58,56,11],['#4e8a3f',62,64,6]]],
    kids:['#fbe7cf','#f3cfa0','#fff4e6',[['#e8a13d',42,58,15],['#c94b3a',58,55,8],['#4e8a3f',60,64,6]]]};
  const c=T[theme]||T.oats;
  const foods=c[3].map(f=>`<ellipse cx="${f[1]}" cy="${f[2]}" rx="${f[3]}" ry="${f[3]*0.82}" fill="${f[0]}"/>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 100 66"><defs><radialGradient id="g" cx="32%" cy="26%" r="85%"><stop offset="0%" stop-color="${c[0]}"/><stop offset="100%" stop-color="${c[1]}"/></radialGradient></defs><rect width="100" height="66" fill="url(#g)"/><ellipse cx="50" cy="40" rx="30" ry="24" fill="rgba(0,0,0,0.06)"/><ellipse cx="50" cy="38" rx="28" ry="22" fill="${c[2]}"/>${foods}<ellipse cx="38" cy="24" rx="18" ry="8" fill="rgba(255,255,255,0.16)"/></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
function themeFor(name){const n=(name||'').toLowerCase();
  if(/salmon|miso/.test(n))return'salmon';if(/cod|fish|sea bass|haddock/.test(n))return'fish';
  if(/chicken|quinoa|turkey/.test(n))return'chicken';if(/beef|ragu|ragù|lamb|mince/.test(n))return'beef';
  if(/egg|omelette|shakshuka|frittata/.test(n))return'eggs';if(/wrap|hummus|halloumi|salad|jacket/.test(n))return'wrap';
  if(/oats|yogurt|yoghurt|porridge|granola|smoothie/.test(n))return'oats';return'wrap';}

function macroChips(m){
  const out=[];
  if(m.protein_g!=null)out.push(['p','P '+Math.round(m.protein_g)+'g']);
  if(m.carbs_g!=null)out.push(['c','C '+Math.round(m.carbs_g)+'g']);
  if(m.fat_g!=null)out.push(['f','F '+Math.round(m.fat_g)+'g']);
  if(m.omega3_mg>=100)out.push(['o','ω3 '+Math.round(m.omega3_mg)+'mg']);
  if(m.timing_context==='post-workout-recovery')out.push(['t','Post-workout']);
  else if(m.timing_context==='pre-workout')out.push(['t','Pre-workout']);
  return out.map(x=>`<span class="c ${x[0]}">${x[1]}</span>`).join('');
}
function dayTag(d){
  const t=(d.day_type||'').toLowerCase();
  if(t.indexOf('training')>=0||t.indexOf('race')>=0||t.indexOf('carb_load')>=0)return['training','Training day'];
  if(t.indexOf('out')>=0)return['out','Eating out'];
  if(d.day==='Saturday'||d.day==='Sunday')return['weekend','Weekend'];
  if(t.indexOf('rest')>=0)return['rest','Rest day'];
  return['rest',''];
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(plan){
  currentPlan=plan;
  document.getElementById('range').textContent = 'Your week · '+((plan.days||[]).length)+' days';
  // stats
  const s=document.getElementById('stats');s.innerHTML='';
  const stat=(n,l)=>{const d=document.createElement('div');d.className='pill';d.innerHTML='<div class="n">'+n+'</div><div class="l">'+l+'</div>';return d;};
  if(plan.cost_summary&&plan.cost_summary.grand_total_gbp)s.appendChild(stat('£'+Math.round(plan.cost_summary.grand_total_gbp),'Week total'));
  if(plan.tdee)s.appendChild(stat(plan.tdee,'TDEE (adult 1)'));
  if(plan.training_day_kcal)s.appendChild(stat(plan.training_day_kcal,'Training day kcal'));
  if(plan.rest_day_kcal)s.appendChild(stat(plan.rest_day_kcal,'Rest day kcal'));

  const wrap=document.getElementById('days');wrap.innerHTML='';
  (plan.days||[]).forEach((d,di)=>{
    const block=document.createElement('div');block.className='day';
    const [tc,tl]=dayTag(d);
    const allMeals=d.meals||[];
    const cards=allMeals.map((m,mi)=>{
      if(m.type==='Snack')return '';
      if(m.is_out){
        return `<div class="outcard"><div class="sl">${esc(m.type)}</div>🍜 Eating out — ${esc(m.out_suggestion||'no dinner planned; the rest of the day is a touch lighter to balance.')}</div>`;
      }
      const kids=m.kids_meal&&m.kids_meal.name?`<div class="kids"><b>Kids eat separately:</b> ${esc(m.kids_meal.name)}${m.kids_meal.kcal?' · '+Math.round(m.kids_meal.kcal)+' kcal':''}</div>`:'';
      const isFav=ctx.favourites.has(m.name);
      const isEaten=eatenSet.has(di+':'+mi);
      return `<div class="meal${isEaten?' eaten':''}">
        <div class="mimg" style="background-image:url('${tile(themeFor(m.name))}')"><span class="slot">${esc(m.type)}</span></div>
        <div class="mbody">
          <div class="mname">${esc(m.name||'')}</div>
          <div class="chips">${macroChips(m)}</div>
          <div class="mfoot"><span class="kcal">${m.kcal?Math.round(m.kcal)+' kcal':''}${m.shared===false&&!m.kids_meal?' · adults':''}</span></div>
          <div class="macts">
            <button class="mact eaten${isEaten?' on':''}" data-act="eaten" data-di="${di}" data-mi="${mi}" title="Mark as eaten">✓ Eaten</button>
            <button class="mact" data-act="recipe" data-di="${di}" data-mi="${mi}" title="See the recipe">Recipe</button>
            <button class="mact fav${isFav?' on':''}" data-act="fav" data-di="${di}" data-mi="${mi}" title="Save as favourite">${isFav?'♥':'♡'}</button>
            <button class="mact" data-act="swap" data-di="${di}" data-mi="${mi}" title="Swap this meal">↺ Swap</button>
          </div>
          ${kids}
        </div>
      </div>`;
    }).join('');
    let html=`<div class="day-head"><span class="day-name">${esc(d.day||'')}</span>${tl?`<span class="tag ${tc}">${tl}</span>`:''}</div><div class="grid">${cards}</div>`;
    const snacks=allMeals.filter(m=>m.type==='Snack');
    if(snacks.length){
      const list=snacks.map(m=>esc(m.name)).join(' · ');
      html+=`<div class="snacks"><span class="ic">🍎</span><span><b>Snacks:</b> ${list}</span></div>`;
    }
    block.innerHTML=html;wrap.appendChild(block);
  });

  // shopping list availability
  const hasShopping = plan.shopping && Object.keys(plan.shopping).some(k=>Array.isArray(plan.shopping[k])&&plan.shopping[k].length);
  const approveBtn=document.getElementById('approveBtn');
  const shopWrap=document.getElementById('shopping');
  shopWrap.innerHTML='';
  if(hasShopping){
    approveBtn.style.display='';
    approveBtn.disabled=false;
    approveBtn.textContent='Approve & view shopping list ↓';
  }else{
    approveBtn.style.display='none';
  }
}

function renderShopping(plan){
  const shopWrap=document.getElementById('shopping');
  const shop=plan.shopping||{};
  let cats='';
  Object.keys(shop).forEach(cat=>{
    const items=shop[cat];
    if(!Array.isArray(items)||!items.length)return;
    const rows=items.map(it=>{
      const price=(it.estimated_price_gbp!=null)?('£'+Number(it.estimated_price_gbp).toFixed(2)):'';
      const qty=[it.qty,it.qty_note].filter(Boolean).join(' · ');
      const url=retailerSearchUrl(ctx.retailer,it.item||'');
      return `<div class="item"><input type="checkbox"><a class="nm" href="${url}" target="_blank" rel="noopener noreferrer">${esc(it.item||'')}${qty?`<span class="qn">${esc(qty)}</span>`:''}</a><span class="pr">${price}</span></div>`;
    }).join('');
    cats+=`<div class="shopcat"><h3>${esc(cat)}</h3>${rows}</div>`;
  });
  const cs=plan.cost_summary||{};
  const total=cs.grand_total_gbp!=null?('£'+Number(cs.grand_total_gbp).toFixed(2)):'';
  const perday=cs.per_person_per_day_gbp!=null?('£'+Number(cs.per_person_per_day_gbp).toFixed(2)+' per person / day'):'';
  shopWrap.innerHTML=`<div class="shopwrap" id="shopcard">
    <div class="shophead"><h2>Your shopping list</h2></div>
    <div class="shopsub">Ordered by aisle, priced at your chosen range. Tap any item to find it at <b>${esc(ctx.retailer)}</b> (opens in a new tab); tick items as you shop.</div>
    ${cats}
    <div class="shoptot"><span>Estimated week total</span><span class="big">${total}</span></div>
    ${perday?`<div class="shopsub" style="text-align:right;margin:6px 0 0">${esc(perday)}</div>`:''}
  </div>`;
  // tick behaviour
  shopWrap.querySelectorAll('.item input').forEach(cb=>cb.addEventListener('change',e=>{
    e.target.closest('.item').classList.toggle('done',e.target.checked);
  }));
}

// ── swap flow ──
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');
function closeModal(){overlay.classList.remove('show');modal.innerHTML='';}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});

async function openSwap(di,mi){
  const meal=currentPlan.days[di].meals[mi];
  overlay.classList.add('show');
  modal.innerHTML=`<h3>Swap this meal</h3><div class="msub">${esc(meal.type)} · ${esc(meal.name||'')}</div><div class="loading">Finding alternatives…</div>`;
  if(!authToken){
    modal.innerHTML=`<h3>Swap this meal</h3><div class="msub">Sign in to get live alternatives.</div><button class="close" id="mc">Close</button>`;
    document.getElementById('mc').addEventListener('click',closeModal);return;
  }
  try{
    const res=await api('/api/plans/swap','POST',{currentMeal:meal.name,mealType:meal.type});
    const alts=(res&&res.alternatives)||[];
    if(!alts.length){ modal.innerHTML=`<h3>Swap this meal</h3><div class="msub">No alternatives came back — try again.</div><button class="close" id="mc">Close</button>`; document.getElementById('mc').addEventListener('click',closeModal); return; }
    let html=`<h3>Pick a replacement</h3><div class="msub">for ${esc(meal.type)} · ${esc(meal.name||'')}</div>`;
    alts.forEach((a,i)=>{ html+=`<div class="alt" data-i="${i}"><div class="an">${esc(a.name)}</div><div class="ad">${esc(a.description||'')}</div>${a.kcal?`<div class="ak">${Math.round(a.kcal)} kcal</div>`:''}</div>`; });
    html+=`<button class="close" id="mc">Keep the original</button>`;
    modal.innerHTML=html;
    modal.querySelectorAll('.alt').forEach(node=>node.addEventListener('click',()=>applySwap(di,mi,alts[+node.dataset.i])));
    document.getElementById('mc').addEventListener('click',closeModal);
  }catch(e){
    modal.innerHTML=`<h3>Swap this meal</h3><div class="msub">Couldn’t reach the server. Try again.</div><button class="close" id="mc">Close</button>`;
    document.getElementById('mc').addEventListener('click',closeModal);
  }
}
// Apply the chosen replacement: full swap via the backend so nutrition AND the
// shopping list are rebuilt consistently, then re-render the whole plan.
async function applySwap(di,mi,alt){
  if(!currentPlanId || !authToken){
    // No saved plan to rebuild against — fall back to an in-view name/kcal swap.
    const m=currentPlan.days[di].meals[mi];
    m.name=alt.name; m.kcal=alt.kcal!=null?alt.kcal:m.kcal;
    delete m.protein_g; delete m.carbs_g; delete m.fat_g; delete m.omega3_mg;
    closeModal(); render(currentPlan);
    banner('Swapped in “'+esc(alt.name)+'”. Sign in with a saved plan to also rebuild macros & shopping.','warn');
    return;
  }
  modal.innerHTML=`<h3>Updating your plan…</h3><div class="msub">Rebuilding “${esc(alt.name)}”, its macros and your shopping list. This takes ~15–20 seconds.</div><div class="loading">Working…</div>`;
  try{
    const res=await api('/api/plans/'+currentPlanId+'/apply-swap','POST',{dayIndex:di,mealIndex:mi,replacementName:alt.name});
    if(res&&res.success&&res.plan){
      closeModal();
      currentPlan=res.plan;
      repaint();
      banner('Swapped in “'+esc(alt.name)+'” — calories, macros and shopping list updated'+(res.saved?' and saved.':'.'),'ok');
    }else{
      modal.innerHTML=`<h3>Couldn’t apply the swap</h3><div class="msub">${esc((res&&res.error)||'Please try again.')}</div><button class="close" id="mc">Close</button>`;
      document.getElementById('mc').addEventListener('click',closeModal);
    }
  }catch(e){
    modal.innerHTML=`<h3>Couldn’t apply the swap</h3><div class="msub">Couldn’t reach the server. Your plan is unchanged — try again.</div><button class="close" id="mc">Close</button>`;
    document.getElementById('mc').addEventListener('click',closeModal);
  }
}

// ── recipe / method view ──
function fmtRecipe(t){ return esc(String(t||'')).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>'); }
async function openRecipe(di,mi){
  const m=currentPlan.days[di].meals[mi];
  overlay.classList.add('show');
  modal.innerHTML=`<h3>${esc(m.name||'Recipe')}</h3><div class="msub">${esc(m.type||'')} · serves ${ctx.familySize}</div><div class="loading">Writing the recipe…</div>`;
  if(!authToken){ modal.innerHTML=`<h3>${esc(m.name||'Recipe')}</h3><div class="msub">Sign in to see the full method.</div><button class="close" id="mc">Close</button>`; document.getElementById('mc').addEventListener('click',closeModal); return; }
  try{
    const res=await api('/api/plans/recipes','POST',{meals:[{name:m.name,type:m.type}],familySize:ctx.familySize});
    const text=(res&&res.recipes)||'';
    if(!text){ modal.innerHTML=`<h3>${esc(m.name)}</h3><div class="msub">No method came back — try again.</div><button class="close" id="mc">Close</button>`; }
    else { modal.innerHTML=`<h3>${esc(m.name)}</h3><div class="msub">${esc(m.type)} · serves ${ctx.familySize}</div><div class="recipe"><p>${fmtRecipe(text)}</p></div><button class="close" id="mc">Close</button>`; }

  }catch(e){
    modal.innerHTML=`<h3>${esc(m.name||'Recipe')}</h3><div class="msub">Couldn’t reach the server. Try again.</div><button class="close" id="mc">Close</button>`;
    document.getElementById('mc').addEventListener('click',closeModal);
  }
}

// ── save a meal as a favourite (recurs in future plans) ──
async function toggleFav(di,mi,btn){
  const name=currentPlan.days[di].meals[mi].name; if(!name)return;
  if(!authToken||!ctx.profileId){ banner('Sign in to save favourite meals.','warn'); return; }
  const nowFav=!ctx.favourites.has(name);
  if(nowFav) ctx.favourites.add(name); else ctx.favourites.delete(name);
  btn.classList.toggle('on',nowFav); btn.textContent=nowFav?'♥':'♡';
  const favObj={}; ctx.favourites.forEach(n=>favObj[n]=true);
  try{
    const res=await api('/api/clients/'+ctx.profileId+'/favourites','PATCH',{favourites:favObj});
    if(res&&res.success){ banner((nowFav?'Saved “'+esc(name)+'” to favourites.':'Removed “'+esc(name)+'” from favourites.')+' Future plans can include your favourites.','ok'); }
    else { throw new Error(); }
  }catch(e){
    // roll back the optimistic toggle
    if(nowFav) ctx.favourites.delete(name); else ctx.favourites.add(name);
    btn.classList.toggle('on',ctx.favourites.has(name)); btn.textContent=ctx.favourites.has(name)?'♥':'♡';
    banner('Couldn’t save favourite — try again.','warn');
  }
}

// ── mark a meal as eaten (client tracking) ──
async function toggleEaten(di,mi,btn){
  const key=di+':'+mi; const now=!eatenSet.has(key);
  if(now) eatenSet.add(key); else eatenSet.delete(key);
  btn.classList.toggle('on',now);
  const card=btn.closest('.meal'); if(card) card.classList.toggle('eaten',now);
  if(authToken && currentPlanId){ try{ await api('/api/plans/'+currentPlanId+'/meal-complete','PATCH',{dayIndex:di,mealIndex:mi,completed:now}); }catch(e){} }
}

document.getElementById('days').addEventListener('click',e=>{
  const btn=e.target.closest('.mact'); if(!btn)return;
  const di=+btn.dataset.di, mi=+btn.dataset.mi, act=btn.dataset.act;
  if(act==='swap') openSwap(di,mi);
  else if(act==='recipe') openRecipe(di,mi);
  else if(act==='fav') toggleFav(di,mi,btn);
  else if(act==='eaten') toggleEaten(di,mi,btn);
});

// Unwrap whatever the API/handoff gives us into the flat plan object render() wants.
function unwrapPlan(x){
  if(!x||typeof x!=='object') return null;
  if(Array.isArray(x.days)) return x;                         // already the plan
  if(x.plan_data&&Array.isArray(x.plan_data.days)){           // saved DB row → merge row-level cost_summary
    return Object.assign({},x.plan_data,{cost_summary:x.plan_data.cost_summary||x.cost_summary});
  }
  if(x.plan) return unwrapPlan(x.plan);                       // { plan: ... } envelope
  return null;
}

function renderEmpty(msg){
  document.getElementById('range').textContent='Your week';
  document.getElementById('stats').innerHTML='';
  document.getElementById('shopping').innerHTML='';
  const ab=document.getElementById('approveBtn'); if(ab)ab.style.display='none';
  document.getElementById('days').innerHTML=`<div class="empty"><h2>No plan yet</h2><p>${esc(msg||'Head to This Week to generate your first plan for the household.')}</p><a class="btn btn-primary" href="thisweek.html">Plan this week →</a></div>`;
}

async function init(){
  currentPlanId = new URLSearchParams(location.search).get('plan');   // saved-plan id (both entry paths carry it)
  loadContext();   // profile: retailer (shopping links), family size (recipes), favourites (non-blocking)

  // 1. Fresh hand-off from This Week (most reliable) — consume once.
  try{
    const fresh=sessionStorage.getItem('mpp_plan');
    if(fresh){
      sessionStorage.removeItem('mpp_plan');
      const plan=unwrapPlan(JSON.parse(fresh));
      if(plan){ render(plan); banner('Here’s your new plan for the week. Swap any meal, or approve to get your shopping list.','ok'); return; }
    }
  }catch(e){}

  // Signed out → send to sign-in rather than showing demo data as if it were theirs.
  if(!authToken){ location.replace('login.html'); return; }

  // 2. A specific saved plan by id.
  if(currentPlanId){
    banner('Loading plan…','ok');
    try{ const res=await api('/api/plans/'+currentPlanId); const plan=unwrapPlan(res&&res.plan?res.plan:res);
      if(plan){ render(plan); banner('Loaded your saved plan.','ok'); return; } }
    catch(e){}
    // fall through to loading their most recent plan
  }

  // 3. Cold open (nav tab / bookmark) → load the household's MOST RECENT saved plan.
  banner('Loading your latest plan…','ok');
  try{
    const list=await api('/api/clients');
    const pid=list&&list.profiles&&list.profiles[0]&&list.profiles[0].id;
    if(pid){
      const d=await api('/api/clients/'+pid);
      const plans=((d&&d.plans)||[]).slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
      if(plans.length){
        currentPlanId=plans[0].id;
        const res=await api('/api/plans/'+currentPlanId);
        const plan=unwrapPlan(res&&res.plan?res.plan:res);
        if(plan){ render(plan); banner('Your most recent plan.','ok'); return; }
      }
      renderEmpty();
      banner('No plan yet — generate your first from This Week.','warn');
      return;
    }
    renderEmpty('Set up your household in Settings, then plan your week.');
    banner('No household profile yet.','warn');
  }catch(e){
    renderEmpty('We couldn’t load your plan just now — please try again.');
    banner('Couldn’t reach the server.','warn');
  }
}
document.getElementById('signout').addEventListener('click',()=>{ try{localStorage.removeItem('authToken');localStorage.removeItem('currentUser');}catch(e){} location.href='login.html'; });
init();
