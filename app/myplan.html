<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Pro — My Plan (rebuild)</title>
<style>
  :root{
    --green:#1a8f5a;--green-dark:#15784a;--green-accent:#3da972;--green-soft:#e5f2ea;
    --cream:#f4ede4;--cream-deep:#ebe1d2;--white:#fff;
    --ink:#1f1f1f;--ink-soft:#3d3d3d;--grey:#7d7d7d;--grey-light:#b8b3a9;--rule:#e2dccf;
    --cp:#fdf3d4;--cpt:#8a6d1a;--cc:#fde6cf;--cct:#9b561e;--cf:#fdd9d9;--cft:#9c3e3e;--co:#d6f0e0;--cot:#2a7a4d;--ct:#e6e1f5;--ctt:#5b4d8a;
    --shadow-sm:0 6px 18px -10px rgba(31,31,31,.14);--shadow:0 12px 32px -14px rgba(31,31,31,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{border-bottom:1px solid var(--rule);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;background:rgba(244,237,228,.94);position:sticky;top:0;z-index:40}
  .logo{font-size:20px;font-weight:700}.logo span{color:var(--green-accent)}
  .badge{font-size:11px;font-weight:600;color:var(--green-dark);background:var(--green-soft);border:1px solid #cfe6da;padding:3px 9px;border-radius:999px;margin-left:10px}
  main{max-width:960px;margin:0 auto;padding:28px 24px 110px}
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--green);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
  .note{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 15px;font-size:13.5px;margin:14px 0 4px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
  .pill{background:var(--white);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm)}
  .pill .n{font-size:20px;font-weight:700;color:var(--green-dark);line-height:1}.pill .l{font-size:11.5px;color:var(--grey);margin-top:4px}
  .day{margin-bottom:30px}
  .day-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .day-name{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .tag{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
  .tag.training{background:var(--green-soft);color:var(--green-dark)}.tag.rest{background:var(--ct);color:var(--ctt)}
  .tag.out{background:#fdf0e6;color:var(--cct)}.tag.weekend{background:#e6f0f5;color:#2c6b8a}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .meal{background:var(--white);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .2s}
  .meal:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .mimg{height:120px;position:relative;background-size:cover;background-position:center}
  .slot{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--ink-soft);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .mbody{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column}
  .mname{font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:9px;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .c{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .c.p{background:var(--cp);color:var(--cpt)}.c.c{background:var(--cc);color:var(--cct)}.c.f{background:var(--cf);color:var(--cft)}.c.o{background:var(--co);color:var(--cot)}.c.t{background:var(--ct);color:var(--ctt)}
  .kcal{font-size:12.5px;color:var(--grey);font-weight:500}
  .kids{margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);font-size:12px;color:var(--ink-soft)}
  .kids b{color:var(--green-dark)}
  .outcard{display:flex;flex-direction:column;justify-content:center;background:#fdf0e6;border:1px dashed #f0c9a8;border-radius:14px;padding:18px;color:var(--cct);font-size:13px;line-height:1.5}
  .outcard .sl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;opacity:.85}
  .snacks{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;background:var(--white);border:1px solid var(--rule);border-radius:12px;font-size:12.5px;color:var(--ink-soft)}
  .snacks .ic{width:26px;height:26px;border-radius:8px;background:var(--co);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .snacks b{color:var(--ink)}
  nav.appnav{display:flex;align-items:center;gap:4px}
  nav.appnav a{font-size:13.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:8px}
  nav.appnav a:hover{background:var(--green-soft);color:var(--green-dark)}
  nav.appnav a.on{color:var(--green-dark);background:var(--green-soft)}
  nav.appnav button{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--grey);cursor:pointer;padding:7px 12px;border-radius:8px}
  nav.appnav button:hover{color:#9c3e3e}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;padding:11px 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-dark)}
  .btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--rule)}
  @media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.grid{grid-template-columns:1fr}nav.appnav a,nav.appnav button{padding:7px 8px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div><span class="logo">Meal Plan <span>Pro</span></span></div>
  <nav class="appnav">
    <a href="thisweek.html">This Week</a>
    <a href="myplan.html" class="on">My Plan</a>
    <a href="settings.html">Settings</a>
    <button id="signout" type="button">Sign out</button>
  </nav>
</header>
<main>
  <div class="topbar">
    <div>
      <div class="eyebrow" id="range">Your week</div>
      <h1>This week's plan.</h1>
    </div>
    <a class="btn btn-primary" href="thisweek.html">Plan another week →</a>
  </div>
  <div id="banner" class="note" style="display:none"></div>
  <div class="stats" id="stats"></div>
  <div id="days"></div>
</main>

<script>
const BACKEND='https://meal-plan-backend-su6p.onrender.com';
let authToken=(typeof localStorage!=='undefined'&&localStorage.getItem('authToken'))||null;
function api(path){const o={headers:{'Content-Type':'application/json'}};if(authToken)o.headers.Authorization='Bearer '+authToken;return fetch(BACKEND+path,o).then(r=>r.json());}

// ── themed "photo" tile (stand-in for the matched stock library) ──
function tile(theme){
  const T={oats:['#efe0c0','#e2cc9e','#f6efe0',[['#c99a63',36,58,17],['#b5532f',56,52,7],['#7c4bb0',63,60,6]]],
    salmon:['#f3d3c2','#e7a988','#f7efe6',[['#e0805f',40,58,17],['#3f7d46',60,56,10],['#f0e7d4',56,66,11]]],
    chicken:['#e4ecc9','#cfe0a8','#f5f2e6',[['#e7d5a6',40,58,16],['#4e8a3f',58,54,11],['#c94b3a',62,64,6]]],
    fish:['#d7e4e2','#aecdc9','#f2efe6',[['#e7ddc6',42,58,16],['#5a9e9a',60,55,9],['#c9a24b',56,64,7]]],
    eggs:['#f5e7c6','#eed7a4','#faf4e6',[['#f6efe0',42,58,17],['#f0b429',43,57,7],['#c96a3a',60,60,9]]],
    wrap:['#eed9b6','#ddbe8a','#f6efe0',[['#e0c893',42,56,16],['#4e8a3f',56,52,9],['#c94b3a',60,63,6]]],
    beef:['#e6cbb0','#d3a578','#f5ece0',[['#8a4a33',40,58,16],['#e9dcbf',58,56,11],['#4e8a3f',62,64,6]]],
    kids:['#fbe7cf','#f3cfa0','#fff4e6',[['#e8a13d',42,58,15],['#c94b3a',58,55,8],['#4e8a3f',60,64,6]]]};
  const c=T[theme]||T.oats;
  const foods=c[3].map(f=>`<ellipse cx="${f[1]}" cy="${f[2]}" rx="${f[3]}" ry="${f[3]*0.82}" fill="${f[0]}"/>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 100 66"><defs><radialGradient id="g" cx="32%" cy="26%" r="85%"><stop offset="0%" stop-color="${c[0]}"/><stop offset="100%" stop-color="${c[1]}"/></radialGradient></defs><rect width="100" height="66" fill="url(#g)"/><ellipse cx="50" cy="40" rx="30" ry="24" fill="rgba(0,0,0,0.06)"/><ellipse cx="50" cy="38" rx="28" ry="22" fill="${c[2]}"/>${foods}<ellipse cx="38" cy="24" rx="18" ry="8" fill="rgba(255,255,255,0.16)"/></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
function themeFor(name){const n=(name||'').toLowerCase();
  if(/salmon|miso/.test(n))return'salmon';if(/cod|fish|sea bass|haddock/.test(n))return'fish';
  if(/chicken|quinoa|turkey/.test(n))return'chicken';if(/beef|ragu|ragù|lamb|mince/.test(n))return'beef';
  if(/egg|omelette|shakshuka|frittata/.test(n))return'eggs';if(/wrap|hummus|halloumi|salad|jacket/.test(n))return'wrap';
  if(/oats|yogurt|yoghurt|porridge|granola|smoothie/.test(n))return'oats';return'wrap';}

function macroChips(m){
  const out=[];
  if(m.protein_g!=null)out.push(['p','P '+Math.round(m.protein_g)+'g']);
  if(m.carbs_g!=null)out.push(['c','C '+Math.round(m.carbs_g)+'g']);
  if(m.fat_g!=null)out.push(['f','F '+Math.round(m.fat_g)+'g']);
  if(m.omega3_mg>=100)out.push(['o','ω3 '+Math.round(m.omega3_mg)+'mg']);
  if(m.timing_context==='post-workout-recovery')out.push(['t','Post-workout']);
  else if(m.timing_context==='pre-workout')out.push(['t','Pre-workout']);
  return out.map(x=>`<span class="c ${x[0]}">${x[1]}</span>`).join('');
}
function dayTag(d){
  const t=(d.day_type||'').toLowerCase();
  if(t.indexOf('training')>=0||t.indexOf('race')>=0||t.indexOf('carb_load')>=0)return['training','Training day'];
  if(t.indexOf('out')>=0)return['out','Eating out'];
  if(d.day==='Saturday'||d.day==='Sunday')return['weekend','Weekend'];
  if(t.indexOf('rest')>=0)return['rest','Rest day'];
  return['rest',''];
}

function render(plan){
  document.getElementById('range').textContent = 'Your week · '+((plan.days||[]).length)+' days';
  // stats
  const s=document.getElementById('stats');s.innerHTML='';
  const stat=(n,l)=>{const d=document.createElement('div');d.className='pill';d.innerHTML='<div class="n">'+n+'</div><div class="l">'+l+'</div>';return d;};
  if(plan.cost_summary&&plan.cost_summary.grand_total_gbp)s.appendChild(stat('£'+Math.round(plan.cost_summary.grand_total_gbp),'Week total'));
  if(plan.tdee)s.appendChild(stat(plan.tdee,'TDEE (adult 1)'));
  if(plan.training_day_kcal)s.appendChild(stat(plan.training_day_kcal,'Training day kcal'));
  if(plan.rest_day_kcal)s.appendChild(stat(plan.rest_day_kcal,'Rest day kcal'));

  const wrap=document.getElementById('days');wrap.innerHTML='';
  (plan.days||[]).forEach(d=>{
    const block=document.createElement('div');block.className='day';
    const [tc,tl]=dayTag(d);
    const meals=(d.meals||[]).filter(m=>m.type!=='Snack');
    const snacks=(d.meals||[]).filter(m=>m.type==='Snack');
    const cards=meals.map(m=>{
      if(m.is_out){
        return `<div class="outcard"><div class="sl">${m.type}</div>🍜 Eating out — ${m.out_suggestion||'no dinner planned; the rest of the day is a touch lighter to balance.'}</div>`;
      }
      const kids=m.kids_meal&&m.kids_meal.name?`<div class="kids"><b>Kids eat separately:</b> ${m.kids_meal.name}${m.kids_meal.kcal?' · '+Math.round(m.kids_meal.kcal)+' kcal':''}</div>`:'';
      return `<div class="meal">
        <div class="mimg" style="background-image:url('${tile(themeFor(m.name))}')"><span class="slot">${m.type}</span></div>
        <div class="mbody">
          <div class="mname">${m.name||''}</div>
          <div class="chips">${macroChips(m)}</div>
          <div class="kcal">${m.kcal?Math.round(m.kcal)+' kcal':''}${m.shared===false&&!m.kids_meal?' · adults':''}</div>
          ${kids}
        </div>
      </div>`;
    }).join('');
    let html=`<div class="day-head"><span class="day-name">${d.day||''}</span>${tl?`<span class="tag ${tc}">${tl}</span>`:''}</div><div class="grid">${cards}</div>`;
    if(snacks.length){
      const list=snacks.map(m=>m.name).join(' · ');
      html+=`<div class="snacks"><span class="ic">🍎</span><span><b>Snacks:</b> ${list}</span></div>`;
    }
    block.innerHTML=html;wrap.appendChild(block);
  });
}

function banner(msg,kind){const b=document.getElementById('banner');b.style.display='flex';b.style.background=kind==='warn'?'#fdf0e6':'var(--green-soft)';b.style.borderColor=kind==='warn'?'#f0c9a8':'#cfe6da';b.style.color=kind==='warn'?'#8a4b1e':'var(--green-dark)';b.innerHTML='<span>'+(kind==='warn'?'⚠️':'✓')+'</span><span>'+msg+'</span>';}

// ── sample plan (matches the claude.js JSON schema) for preview ──
const SAMPLE={ tdee:2320, training_day_kcal:2320, rest_day_kcal:2320,
  cost_summary:{grand_total_gbp:84},
  days:[
    { day:'Monday', day_type:'training', meals:[
      {type:'Breakfast',name:'Overnight oats with banana & peanut butter',kcal:520,protein_g:22,carbs_g:75,fat_g:14},
      {type:'Lunch',name:'Leftover roast chicken & quinoa salad',kcal:560,protein_g:42,carbs_g:48,fat_g:18,timing_context:''},
      {type:'Dinner',name:'Miso salmon with jasmine rice & tenderstem',kcal:740,protein_g:38,carbs_g:62,fat_g:22,omega3_mg:240,timing_context:'post-workout-recovery'},
      {type:'Snack',name:'Greek yoghurt & almonds'},{type:'Snack',name:'Banana'} ]},
    { day:'Wednesday', day_type:'normal', meals:[
      {type:'Breakfast',name:'Three-egg omelette with spinach & feta',kcal:430,protein_g:30,carbs_g:8,fat_g:30},
      {type:'Lunch',name:'Chickpea & feta wrap (≤30 min)',kcal:520,protein_g:22,carbs_g:58,fat_g:20},
      {type:'Dinner',name:'Cod traybake with new potatoes & greens',kcal:610,protein_g:46,carbs_g:48,fat_g:18,omega3_mg:240,shared:false,kids_meal:{name:'Homemade fish fingers, wedges & peas',kcal:480}},
      {type:'Snack',name:'Apple & peanut butter'} ]},
    { day:'Friday', day_type:'out_evening', meals:[
      {type:'Breakfast',name:'Greek yoghurt bowl with berries',kcal:360,protein_g:24,carbs_g:38,fat_g:10},
      {type:'Lunch',name:'Leftovers · kids’ packed lunch',kcal:480,protein_g:26,carbs_g:44,fat_g:16},
      {type:'Dinner',is_out:true,out_suggestion:'dinner’s off the plan and its ingredients skipped; breakfast & lunch eased ~20% lighter.'},
      {type:'Snack',name:'Fruit & oatcakes'} ]},
  ]};

// Unwrap whatever the API/handoff gives us into the flat plan object render() wants.
// A freshly-generated plan is already flat ({days,...}); a saved row wraps it in plan_data.
function unwrapPlan(x){
  if(!x||typeof x!=='object') return null;
  if(Array.isArray(x.days)) return x;                         // already the plan
  if(x.plan_data&&Array.isArray(x.plan_data.days)){           // saved DB row → merge row-level cost_summary
    return Object.assign({},x.plan_data,{cost_summary:x.plan_data.cost_summary||x.cost_summary});
  }
  if(x.plan) return unwrapPlan(x.plan);                       // { plan: ... } envelope
  return null;
}

async function init(){
  // 1. Fresh hand-off from This Week (most reliable) — consume once.
  try{
    const fresh=sessionStorage.getItem('mpp_plan');
    if(fresh){
      sessionStorage.removeItem('mpp_plan');
      const plan=unwrapPlan(JSON.parse(fresh));
      if(plan){ render(plan); banner('Here’s your new plan for the week.','ok'); return; }
    }
  }catch(e){}

  // 2. A saved plan by id (returning to an existing plan).
  const params=new URLSearchParams(location.search);
  const planId=params.get('plan');
  if(authToken && planId){
    banner('Loading plan…','ok');
    try{ const res=await api('/api/plans/'+planId); const plan=unwrapPlan(res&&res.plan?res.plan:res);
      if(plan){ render(plan); banner('Loaded your saved plan.','ok'); return; } }
    catch(e){}
    render(SAMPLE); banner("Couldn't load that plan — showing a sample. Try generating a fresh one from This Week.",'warn'); return;
  }

  // 3. Nothing to show yet.
  render(SAMPLE);
  banner('Sample plan — generate one from This Week to see your household’s real plan here.','warn');
}
document.getElementById('signout').addEventListener('click',()=>{ try{localStorage.removeItem('authToken');localStorage.removeItem('currentUser');}catch(e){} location.href='login.html'; });
init();
</script>
</body>
</html>
