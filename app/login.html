<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Pro — Sign in</title>
<style>
  :root{
    --green:#1a8f5a;--green-dark:#15784a;--green-accent:#3da972;--green-soft:#e5f2ea;
    --cream:#f4ede4;--cream-deep:#ebe1d2;--white:#fff;
    --ink:#1f1f1f;--ink-soft:#3d3d3d;--grey:#7d7d7d;--grey-light:#b8b3a9;--rule:#e2dccf;
    --shadow-sm:0 6px 18px -10px rgba(31,31,31,.14);--shadow:0 20px 48px -22px rgba(31,31,31,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:1px solid var(--rule);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;background:rgba(244,237,228,.94)}
  .logo{font-size:20px;font-weight:700}.logo span{color:var(--green-accent)}
  .badge{font-size:11px;font-weight:600;color:var(--green-dark);background:var(--green-soft);border:1px solid #cfe6da;padding:3px 9px;border-radius:999px;margin-left:10px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px 60px}
  .panel{width:100%;max-width:420px}
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--green);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;text-align:center}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;text-align:center}
  .sub{font-size:15px;color:var(--ink-soft);margin-bottom:24px;text-align:center}
  .card{background:var(--white);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:26px 24px}
  .field{margin-bottom:15px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);padding:12px 13px;border:1px solid var(--rule);border-radius:10px;background:var(--white)}
  input:focus{outline:none;border-color:var(--green-accent);box-shadow:0 0 0 3px var(--green-soft)}
  .btn{width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;padding:13px 22px;font-size:15px;margin-top:6px}
  .btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-dark)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .msg{font-size:13.5px;border-radius:10px;padding:11px 13px;margin-bottom:16px;display:none}
  .msg.err{display:block;background:#fdd9d9;border:1px solid #e7b4b4;color:#8a2f2f}
  .msg.ok{display:block;background:var(--green-soft);border:1px solid #cfe6da;color:var(--green-dark)}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0 18px;color:var(--grey);font-size:12.5px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}
  .newhere{text-align:center;font-size:14px;color:var(--ink-soft)}
  .newhere a{color:var(--green-dark);font-weight:600;text-decoration:none}
  .newhere a:hover{text-decoration:underline}
  .foot{text-align:center;font-size:12px;color:var(--grey);margin-top:22px}
</style>
</head>
<body>
<header>
  <div><span class="logo">Meal Plan <span>Pro</span></span><span class="badge">Sign in</span></div>
  <div style="font-size:13px;color:var(--grey)">7-day free trial</div>
</header>

<main>
  <div class="panel">
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in to your kitchen.</h1>
    <p class="sub">Your household's already set up — plan this week in a couple of taps.</p>

    <div class="card">
      <div class="msg" id="msg"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <button class="btn btn-primary" id="signInBtn" type="submit">Sign in →</button>
      </form>

      <div class="divider">new to Meal Plan Pro?</div>
      <p class="newhere">First time here? <a href="onboarding.html">Set up your household →</a></p>
    </div>

    <p class="foot">By signing in you agree to the terms. 7 days free · cancel anytime before day 8.</p>
  </div>
</main>

<script>
const BACKEND='https://meal-plan-backend-su6p.onrender.com';

// Already signed in? Go straight to This Week.
try{ if(localStorage.getItem('authToken')){ location.replace('thisweek.html'); } }catch(e){}

function show(kind,text){const m=document.getElementById('msg');m.className='msg '+kind;m.textContent=text;}

document.getElementById('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('signInBtn');
  if(!email||!password){ show('err','Enter your email and password.'); return; }
  btn.disabled=true; btn.textContent='Signing in…'; show('ok','Checking your details…');
  try{
    const res=await fetch(BACKEND+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}).then(r=>r.json());
    if(res&&res.success&&res.token){
      try{
        localStorage.setItem('authToken',res.token);
        if(res.user) localStorage.setItem('currentUser',JSON.stringify(res.user));
      }catch(e){}
      show('ok','Signed in ✓ — taking you to this week…');
      location.href='thisweek.html';
    }else{
      show('err',(res&&res.error)||'Invalid email or password.');
      btn.disabled=false; btn.textContent='Sign in →';
    }
  }catch(err){
    show('err','Couldn’t reach the server. Try again in a moment.');
    btn.disabled=false; btn.textContent='Sign in →';
  }
});
</script>
</body>
</html>
